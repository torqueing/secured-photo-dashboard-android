name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android 37 platform
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests, debug APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: ./gradlew --no-configuration-cache lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: secured-photo-dashboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
